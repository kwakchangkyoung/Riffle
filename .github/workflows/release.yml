# 버전 태그(v*)를 push 하면 macOS 앱을 빌드해 GitHub 릴리스에 첨부한다.
# 사용법: tauri.conf.json 의 version 을 올리고 커밋한 뒤
#   git tag v0.2.0 && git push origin v0.2.0
name: Release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write

jobs:
    # 원격 에이전트(riffle-agent)를 Linux 정적 바이너리로 빌드한다.
    # 앱이 SFTP 호스트의 ~/.cache/riffle 에 업로드해 서버 측 인덱싱·검색·필터에 쓴다.
    agents:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      target: x86_64-unknown-linux-musl
                      arch: x86_64
                    - os: ubuntu-24.04-arm
                      target: aarch64-unknown-linux-musl
                      arch: aarch64
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v7

            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            - uses: Swatinem/rust-cache@v2
              with:
                  key: agent-${{ matrix.target }}

            - name: musl 도구 설치
              run: sudo apt-get update && sudo apt-get install -y musl-tools

            - name: 에이전트 빌드
              run: cargo build --release -p riffle-agent --target ${{ matrix.target }}

            - name: 바이너리 스트립 + 스테이징
              run: |
                  strip target/${{ matrix.target }}/release/riffle-agent
                  mkdir -p staging
                  cp target/${{ matrix.target }}/release/riffle-agent staging/riffle-agent-${{ matrix.arch }}

            - uses: actions/upload-artifact@v4
              with:
                  name: riffle-agent-${{ matrix.arch }}
                  path: staging/riffle-agent-${{ matrix.arch }}

    build:
        needs: agents
        strategy:
            fail-fast: false
            # 두 job 이 같은 릴리스의 latest.json 을 읽고-병합-재업로드하므로
            # 동시에 끝나면 한쪽 플랫폼이 누락될 수 있다. 순차 실행으로 경합을 막는다.
            max-parallel: 1
            matrix:
                include:
                    - target: aarch64-apple-darwin # Apple Silicon
                    - target: x86_64-apple-darwin # Intel
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v7

            # 태그와 앱 버전이 다르면 잘못된 릴리스가 만들어지므로 먼저 막는다
            - name: 태그와 앱 버전 일치 확인
              run: |
                  APP_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
                  if [ "v${APP_VERSION}" != "${GITHUB_REF_NAME}" ]; then
                      echo "태그(${GITHUB_REF_NAME})와 tauri.conf.json 버전(v${APP_VERSION})이 다릅니다."
                      exit 1
                  fi

            # CHANGELOG.md 에서 이 버전의 절을 꺼내 릴리스 노트(=앱 업데이트 알림 내용)로 쓴다
            - name: 변경 내역 추출
              id: changelog
              run: |
                  VERSION="${GITHUB_REF_NAME#v}"
                  NOTES=$(awk -v v="$VERSION" '/^## \[/ { f = (index($0, "## [" v "]") == 1); next } f' CHANGELOG.md)
                  if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
                      echo "CHANGELOG.md 에 [${VERSION}] 절이 없습니다."
                      exit 1
                  fi
                  {
                      echo "notes<<RIFFLE_NOTES_EOF"
                      echo "$NOTES"
                      echo "RIFFLE_NOTES_EOF"
                  } >> "$GITHUB_OUTPUT"

            - uses: pnpm/action-setup@v6
              with:
                  version: 11

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm

            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            - uses: Swatinem/rust-cache@v2
              with:
                  key: ${{ matrix.target }}

            - run: pnpm install --frozen-lockfile

            # 에이전트 바이너리를 앱 번들 리소스(src-tauri/agents/)에 배치한다
            - uses: actions/download-artifact@v4
              with:
                  pattern: riffle-agent-*
                  path: src-tauri/agents
                  merge-multiple: true

            - uses: tauri-apps/tauri-action@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # 업데이터 산출물(.app.tar.gz.sig) 서명용 키.
                  # Secrets에 등록하지 않으면 업데이터 산출물 생성이 실패한다.
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              with:
                  tagName: ${{ github.ref_name }}
                  releaseName: Riffle ${{ github.ref_name }}
                  releaseBody: |
                      ${{ steps.changelog.outputs.notes }}

                      ---
                      **새로 설치:** Apple Silicon 은 `Riffle_<버전>_aarch64.dmg`, Intel 은 `Riffle_<버전>_x64.dmg` 를 받아 `Applications` 로 드래그하세요.
                      코드 서명 전이라 처음 실행 시 경고가 나오면 **우클릭 → 열기** 로 실행합니다. 자세한 내용은 [README](https://github.com/${{ github.repository }}#설치) 를 참고하세요.
                  releaseDraft: false
                  prerelease: false
                  # CI에서만 업데이터 산출물(.app.tar.gz + .sig)을 만들어 latest.json을 생성한다.
                  # 로컬 빌드는 서명 키 없이도 되도록 tauri.conf.json에는 두지 않는다.
                  args: --target ${{ matrix.target }} --config '{"bundle":{"createUpdaterArtifacts":true}}'
